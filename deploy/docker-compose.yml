services:
  libmssdk:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: libmssdk:local
    container_name: libmssdk
    restart: unless-stopped
    # 收尾要留够时间：SIGTERM → entrypoint 转成 SIGINT → Node 改口 /readyz、留排空窗口、
    # 收在飞请求、收 worker。Docker 默认只等 10 秒，不够跑完这条序列。
    stop_grace_period: 30s
    # Wine 下的 Node 无法使用管道型 stdio（会 open EBADF），必须分配 TTY
    tty: true
    ports:
      # 这里是**宿主**绑定地址：compose 缺省只绑回环，而 run.sh 生成的 .env 默认写 0.0.0.0，
      # 也就是明文 8899 直接对外可达。挂了反向代理就改回 127.0.0.1 —— 容器内进程另有
      # environment 里写死的 0.0.0.0，代理经服务名访问不受这一行影响。
      - "${LIBMSSDK_BIND:-127.0.0.1}:${LIBMSSDK_PORT:-8899}:8899"
    environment:
      LIBMSSDK_TOKEN: "${LIBMSSDK_TOKEN:?请先在 deploy/.env 里设置 LIBMSSDK_TOKEN（run.sh 会自动生成）}"
      LIBMSSDK_CLIENT_DIR: /client
      # 容器内始终监听 0.0.0.0；宿主机端口是否对外由上面的 ports 映射（LIBMSSDK_BIND）决定
      LIBMSSDK_BIND: 0.0.0.0
      LIBMSSDK_PORT: 8899
      LIBMSSDK_STATE_DIR: /app/data
      # 反向代理部署时从 deploy/.env 透传；默认 0 = 只认 TCP 对端
      LIBMSSDK_TRUST_PROXY: "${LIBMSSDK_TRUST_PROXY:-0}"
      # 收尾排空窗口：改口 /readyz 之后先保持监听，让探针/编排器读到 503 再停监听。
      # 0 = 信号一到就停监听（不需要摘流的直连部署）。总时长要小于上面的 stop_grace_period。
      LIBMSSDK_DRAIN_DELAY_MS: "${LIBMSSDK_DRAIN_DELAY_MS:-8000}"
    volumes:
      # 用户必须提供自己官方客户端内的 bdms.node + metasecml.dll
      - ${LIBMSSDK_CLIENT_DIR:?请在 deploy/.env 设置 LIBMSSDK_CLIENT_DIR，指向你的汽水客户端版本目录}:/client:ro
      # 默认用命名卷；想放到指定磁盘（例如 /data）就在 .env 里写绝对路径
      - ${LIBMSSDK_DATA_PATH:-libmssdk-data}:/app/data
      # Wine prefix：首次启动生成（约 1.5GB），之后复用
      - ${LIBMSSDK_WINE_PATH:-libmssdk-wine}:/wine

volumes:
  libmssdk-data:
  libmssdk-wine:
