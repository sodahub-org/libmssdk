# TLS 终结叠一层（可选）。在 deploy/ 目录与主 compose 一起用：
#
#   SIGNER_HOSTNAME=signer.example.com \
#     docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# 域名要能解析到这台机器，Caddy 才会自己签、自己续。本仓库不自签证书那套教程（起个本地 CA 让
# 客户端导入根证书）：那等于让每个客户端替你做一次安全决定，理由写在 Caddyfile 的注释里。
#
# 用这一层之前，先把 deploy/.env 里的 LIBMSSDK_BIND 改成 127.0.0.1：那个变量管的是**宿主**上把
# 8899 发布到哪张网卡（容器内进程固定绑 0.0.0.0，本层经服务名 libmssdk:8899 访问，不受影响）。
# 不收的话，任何人都能绕过 443 直接打 http://<host>:8899/sign，token 与 cookie 走明文。
# 也别在这一层里再补一条 ports: —— compose 对 ports 是合并语义，会变成两条映射并存、明文口照开；
# 真要在这一层里改，得用 !override 整段替换（compose >= 2.24.4），或 !reset 先清空再重定义 ——
# 直接再写一条 ports 只是追加。
#
# 80 端口：Caddy 的自动 HTTPS 除了 ACME 质询，还会在 80 上放一个到 443 的跳转。这只影响从代理
# 进来的流量 —— 签名服务自己的明文 8899 照旧完整服务、不重定向（#1 定的：308 对不跟随重定向的
# 客户端是直接失败，对已经拿到明文的请求又毫无增益）。不想让 80 跳转就在 Caddyfile 顶部全局块里
# 加 `auto_https disable_redirects`；这是你自己的改动，改完跑一次 caddy validate（仓库原样的语法
# 由 CI 验过，见 deploy/README.md）。
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SIGNER_HOSTNAME: "${SIGNER_HOSTNAME:?请先在 deploy/.env 里设置 SIGNER_HOSTNAME，例如 signer.example.com}"
      # 同一个 compose 网络里直接走服务名，不经宿主端口
      LIBMSSDK_UPSTREAM: libmssdk:8899
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - libmssdk

volumes:
  caddy-data:
  caddy-config:
