# 签名服务的反向代理示例（nginx 形态，给已有 nginx 的 Linux / Docker 主机）。
#
# Windows 裸机建议直接用同目录的 Caddyfile（单文件可执行、自动续期）。
#
# 用法：把这段放进 http {} 里，或作为 /etc/nginx/conf.d/libmssdk.conf；
# 证书路径换成你自己的（域名可解析时用 certbot 签的那两份）。

# 这里不设 keepalive：nginx 的 upstream 长连接要求每个 location 都带
# proxy_http_version 1.1 与 proxy_set_header Connection ""，漏一处就只会拿到 warning。
# 探针与 /sign 都是短请求，省掉这一层更不容易写错。
upstream libmssdk {
    server 127.0.0.1:8899;
}

server {
    # 这份示例只听 443：签名服务自己的明文端口（8899）继续完整服务，不在这里做 80 → 443 跳转
    # —— 308 对不跟随重定向的客户端是直接失败，对已经拿到明文的请求又毫无增益。
    listen 443 ssl;
    http2 on;	# 需 nginx ≥ 1.25.1；CI 用 nginx:1.30.6-alpine 跑 nginx -t。更老的版本写成 listen 443 ssl http2;
    server_name signer.example.com;

    ssl_certificate     /etc/letsencrypt/live/signer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signer.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 代理侧兜底。真正的上限在服务自己身上：LIBMSSDK_MAX_BODY_BYTES（默认 256 KB），
    # 超了它回可读的 400，所以这里要留得比 256 KB 大。
    client_max_body_size 1m;

    # 一次签名一两百毫秒，排队预算默认 5 秒，客户端超时 6 秒：
    # 代理的读超时必须等得过这个数，否则客户端拿到的是 504 而不是那个 503。
    proxy_connect_timeout 5s;
    proxy_read_timeout    15s;
    proxy_send_timeout    15s;

    # 探针由编排器高频打，不进取数日志；注意 /readyz 未就绪时是 503，那是正常回答。
    # 写成一条正则而不是每个名字一条 location：/healthz 是 /readyz 的别名。探针清单以
    # src/endpoints.mjs 的 PROBE_PATHS 为准；加别名时改这条正则和 deploy/README.md 的白名单。
    location ~ ^/(livez|readyz|healthz)$ { access_log off; proxy_pass http://libmssdk; }

    location / {
        proxy_pass http://libmssdk;
        proxy_http_version 1.1;
        # 本服务解析路由只看请求行，Host 不参与，所以这里带不带 $host 都不影响行为。
        proxy_set_header Host              $host;
        # 服务默认只认 TCP 对端；要按 XFF 最右一跳分桶得设 LIBMSSDK_TRUST_PROXY=1，
        # 那时 upstream 的 8899 必须只对这台反代可达
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
