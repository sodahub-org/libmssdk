name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'linux / node ${{ matrix.node }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 已 EOL 不再纳入；代码仍兼容 18+，本机开发用的是 26
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  windows:
    name: windows / node 24
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # 原生模块必须由用户从自己的汽水客户端提供，因此 CI 只跑 mock 离线用例。
      - run: npm test
